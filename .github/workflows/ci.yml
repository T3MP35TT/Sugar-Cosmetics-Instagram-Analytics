name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install supported dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit and dashboard smoke tests
        run: python -m pytest -q
      - name: Compile project Python files
        shell: bash
        run: python -m compileall -q app.py pages src utils tests
